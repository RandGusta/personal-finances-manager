spring.application.name=finance-control
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=${PORT:8081}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.frontend-url=${FRONTEND_URL}
security.rate-limit.max-requests=${RATE_LIMIT_MAX_REQUESTS:5}
security.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}


spring.mail.host = smtp.gmail.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.port = 587
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
logging.level.org.springframework.security=WARN
server.error.include-exception=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
