spring.config.import = optional:classpath:application-secrets.properties
spring.application.name=finance-control
spring.datasource.url=jdbc:mysql://localhost:3307/finance_control
spring.datasource.username=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=8081
jwt.expiration=${JWT_EXPIRATION:86400000}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
security.rate-limit.max-requests=${RATE_LIMIT_MAX_REQUESTS:5}
security.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}


spring.mail.host = smtp.gmail.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.port = 587
spring.mail.username = gustavorandiiii@gmail.com
logging.level.org.springframework.security=WARN
server.error.include-exception=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
